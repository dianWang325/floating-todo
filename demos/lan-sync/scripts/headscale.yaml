# Isolated synthetic lab only. Control HTTP is confined to the private demo bridge.
server_url: http://10.77.42.5:8080
listen_addr: 10.77.42.5:8080
metrics_listen_addr: 127.0.0.1:9090
grpc_listen_addr: 127.0.0.1:50443
noise:
  private_key_path: /var/lib/headscale/noise.key
prefixes:
  v4: 100.100.42.0/24
  v6: fd7a:115c:a1e0:4242::/64
  allocation: sequential
derp:
  server:
    enabled: false
  urls:
    - https://controlplane.tailscale.com/derpmap/default
  auto_update_enabled: false
node:
  # These three isolated lab devices stay usable until the demo is explicitly stopped.
  expiry: 0
  ephemeral:
    inactivity_timeout: 30m
database:
  type: sqlite
  sqlite:
    path: /var/lib/headscale/db.sqlite
    write_ahead_log: true
dns:
  magic_dns: false
  base_domain: todo-demo.invalid
  override_local_dns: false
  nameservers:
    global: []
log:
  level: warn
unix_socket: /var/run/headscale/headscale.sock
unix_socket_permission: "0700"
policy:
  mode: file
  path: ""
