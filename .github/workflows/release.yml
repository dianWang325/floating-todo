name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing source tag to build (leave empty when dispatching from a tag)"
        required: false
        type: string
      verify_installer:
        description: "Verify and publish already-built draft installers without rebuilding"
        type: boolean
        default: false
      build_run_id:
        description: "Original successful build steps to audit when verifying a draft"
        type: string
        required: false

jobs:
  tests:
    if: ${{ !inputs.verify_installer }}
    uses: ./.github/workflows/tests.yml
    with:
      source_ref: ${{ inputs.release_tag || github.ref }}
    permissions:
      contents: read

  release:
    if: ${{ !inputs.verify_installer }}
    needs: tests
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib --locked

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.release_tag || github.ref_name }}
          releaseName: "待办清单 ${{ inputs.release_tag || github.ref_name }}"
          releaseBody: "下载下方 Windows x64 安装包。"
          releaseDraft: true
          prerelease: ${{ contains(inputs.release_tag || github.ref_name, '-') }}
          args: ${{ matrix.args }}

      - name: Windows application smoke test
        if: matrix.platform == 'windows-latest'
        run: ./tests/installer-smoke.ps1

      - uses: actions/upload-artifact@v4
        if: always() && matrix.platform == 'windows-latest'
        with:
          name: windows-native-smoke
          path: test-results/native/
          if-no-files-found: ignore
          retention-days: 7

  publish:
    if: ${{ !inputs.verify_installer }}
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - name: Normalize installer filenames and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ inputs.release_tag || github.ref_name }}"
          gh release view "$tag" --repo "${{ github.repository }}" --json assets \
            --jq '.assets[] | "\(.apiUrl | split("/") | last) \(.name)"' | while read -r id name; do
            case "$name" in
              *_x64-setup.exe) gh api -X PATCH "repos/${{ github.repository }}/releases/assets/$id" \
                    -f name="floating-todo_${name#*_}" && echo "renamed $name -> floating-todo_${name#*_}" ;;
            esac
          done
          notes="docs/releases/${tag}.md"
          if [ -f "$notes" ]; then
            gh release edit "$tag" --repo "${{ github.repository }}" --notes-file "$notes"
          fi
          gh release edit "$tag" --repo "${{ github.repository }}" --draft=false --title "待办清单 $tag"

  verify_windows:
    if: ${{ inputs.verify_installer }}
    permissions:
      contents: write
      actions: read
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Audit original build evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:BUILD_RUN_ID -notmatch '^\d+$') { throw 'Original build run is required' }
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:BUILD_RUN_ID" | ConvertFrom-Json
          if ($run.head_branch -ne $env:RELEASE_TAG) { throw 'Build run does not match source tag' }
          $jobs = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:BUILD_RUN_ID/jobs" | ConvertFrom-Json
          foreach ($name in @('tests / test', 'tests / native-lan')) {
            if (@($jobs.jobs | Where-Object { $_.name -eq $name -and $_.conclusion -eq 'success' }).Count -ne 1) { throw "Missing original validation: $name" }
          }
          $windows = $jobs.jobs | Where-Object name -eq 'release (windows-latest)'
          foreach ($step in @('Rust tests', 'Build and release')) {
            if (@($windows.steps | Where-Object { $_.name -eq $step -and $_.conclusion -eq 'success' }).Count -ne 1) { throw "Missing original Windows step: $step" }
          }
      - name: Download and verify the immutable Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw 'Invalid release tag' }
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --pattern '*x64-setup.exe' --dir installer
          if ($LASTEXITCODE -ne 0) { throw 'Installer download failed' }
          $assetApi = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json assets --jq '.assets[] | select(.name | endswith("x64-setup.exe")) | .apiUrl'
          if ($LASTEXITCODE -ne 0 -or -not $assetApi) { throw 'Cannot resolve draft installer' }
          $asset = gh api $assetApi --jq '{name,digest}' | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read installer checksum' }
          $file = Get-Item -LiteralPath (Join-Path installer $asset.name)
          $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ("sha256:$hash" -ne $asset.digest) { throw 'Installer checksum mismatch' }
          $destination = Join-Path $env:RUNNER_TEMP 'FloatingTodoVerify'
          $process = Start-Process -FilePath $file.FullName -ArgumentList @('/S', "/D=$destination") -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Installation failed' }
          $exe = Join-Path $destination 'floating-todo.exe'
          if ((Get-Item -LiteralPath $exe).VersionInfo.ProductVersion -ne $env:RELEASE_TAG.Substring(1)) { throw 'Installed version mismatch' }
          "VERIFIED_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Native maximize, timelines, completion and restoration checks
        shell: pwsh
        run: ./tests/native-smoke.ps1 -Executable $env:VERIFIED_EXE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verified-windows-installer
          path: test-results/native/
          retention-days: 7

  publish_verified:
    if: ${{ inputs.verify_installer }}
    permissions:
      contents: write
    needs: verify_windows
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Publish verified installers
        shell: bash
        run: |
          set -euo pipefail
          # The original Windows build tested its native libraries; this job
          # reruns the repaired UI verifier against
          # the exact Windows installer, without rebuilding or retagging it.
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' > assets.txt
          grep -q '_x64-setup.exe$' assets.txt
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes-file "docs/releases/$RELEASE_TAG.md" --title "待办清单 $RELEASE_TAG" --draft=false
