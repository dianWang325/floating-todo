name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  tests:
    uses: ./.github/workflows/tests.yml
    permissions:
      contents: read

  release:
    needs: tests
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
          - platform: "macos-latest"
            args: "--target x86_64-apple-darwin"
          - platform: "windows-latest"
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib --locked

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "floating todo ${{ github.ref_name }}"
          releaseBody: "下载下方对应平台安装包。macOS 首次打开若提示「已损坏」或「身份不明的开发者」，请见 README 的安装说明。Windows 首次运行若被 SmartScreen 拦截，点「更多信息 → 仍要运行」即可。"
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: ${{ matrix.args }}

      - name: Verify application inside macOS installer
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: bash scripts/verify-macos-dmg.sh src-tauri/target

      - name: Windows application smoke test
        if: matrix.platform == 'windows-latest'
        run: ./tests/native-smoke.ps1 -Executable src-tauri/target/release/floating-todo.exe

      - uses: actions/upload-artifact@v4
        if: always() && matrix.platform == 'windows-latest'
        with:
          name: windows-native-smoke
          path: test-results/native/
          if-no-files-found: ignore
          retention-days: 7

  publish:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Normalize installer filenames and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.ref_name }}"
          gh api "repos/${{ github.repository }}/releases/tags/$tag" \
            --jq '.assets[] | "\(.id) \(.name)"' | while read -r id name; do
            case "$name" in
              floating.todo_*|"floating todo_"*) gh api -X PATCH "repos/${{ github.repository }}/releases/assets/$id" \
                    -f name="floating-todo_${name#*_}" && echo "renamed $name -> floating-todo_${name#*_}" ;;
            esac
          done
          notes="docs/releases/${tag}.md"
          if [ -f "$notes" ]; then
            gh release edit "$tag" --repo "${{ github.repository }}" --notes-file "$notes"
          fi
          gh release edit "$tag" --repo "${{ github.repository }}" --draft=false --title "悬浮待办 $tag"
